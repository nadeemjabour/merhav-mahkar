<script>

function uiText(source) { return window.MerhavUI ? window.MerhavUI.t(source) : source; }
function uiLocale() { return ({he:'he-IL', ar:'ar', en:'en'})[window.MerhavUI?.language] || 'he-IL'; }
let S,view='dashboard',paperId='',tab='overview',q='',filter='',sort='updated',gmode='month',storage='';const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),now=()=>new Date().toISOString(),today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Jerusalem',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()),date=s=>s?new Date(s).toLocaleDateString(uiLocale(),{timeZone:'Asia/Jerusalem'}):'לא הוזן';
const statuses=['רעיון','תכנון','איסוף נתונים','ניתוח','כתיבה','בבדיקת שותפים','הוגש','בתיקונים','התקבל','פורסם'],work=['טרם התחיל','נדרשת עבודה משמעותית','דרוש עדכון או תיקון','הושלם'],colors=['gray','red','orange','green'],taskstates=['לביצוע','בעבודה','ממתין לשותף','הושלם'],priority=['רגילה','גבוהה','דחופה'],cats=['טיוטות ופרקים','מקורות','כלי מחקר','נתונים וניתוח','הגשות'];
const menus={dashboard:'◫  לוח בקרה',papers:'▤  המחקרים שלי',tasks:'☑  משימות',gantt:'▥  גאנט מחקרים',tools:'⚒  מאגר כלי מחקר',sources:'▧  מקורות וקריאה',opportunities:'◎  הזדמנויות לפרסום',files:'▱  קבצים וגרסאות',activity:'◷  יומן פעילות',settings:'⚙  שמירה וגיבוי'};
async function api(url,data){let r;try{r=await fetch(url,{...(data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{}),signal:AbortSignal.timeout(30000)})}catch(e){if(e.name==='TimeoutError'||e.name==='AbortError')throw Error('הבקשה התעכבה. התוכן נשמר בטיוטה; אפשר לנסות שוב.');throw e}let b=await r.json();if(!r.ok)throw Error(b.error||'השמירה נכשלה');return b}
let mutationQueue=Promise.resolve();function queuedMutation(url,data){let job=mutationQueue.catch(()=>{}).then(()=>api(url,data));mutationQueue=job;return job}function acceptSavedState(state){if(!S||state.rev>=S.rev)S=state}
function toast(s,error=false){let t=document.createElement('div');t.className='toast'+(error?' error':'');t.textContent=s;document.body.append(t);setTimeout(()=>t.remove(),error?12000:4500)}
async function load(){try{let r=await api('/api/state');storage=r.storage;delete r.storage;S=r;render()}catch(e){toast(e.message,true)}}
let saving=false;async function persist(){if(saving)throw Error('שמירה קודמת עדיין מתבצעת');saving=true;try{S=await api('/api/state',{state:S,rev:S.rev});$('#saved').textContent='נשמר במחשב · '+new Date().toLocaleTimeString(uiLocale());return true}catch(e){toast(e.message+' התוכן נשאר בחלון זה. ניתן לנסות שוב.',true);throw e}finally{saving=false}}
function go(v){if(v==='chat'){openResearchChat();return}view=v;paperId='';q='';filter='';render()}function openPaper(id){paperId=id;view='papers';tab='overview';q='';filter='';render()}
function displayChoice(value, choices, fallback = 'לא הוזן') {
  return value ? (choices.includes(value) ? uiText(value) : value) : uiText(fallback);
}
function badge(s){return `<span class="tag ${colors[work.indexOf(s)]||'gray'}">${esc(displayChoice(s,work))}</span>`}function overdue(t){return t.due&&t.due<today()&&!['הושלם','התקבל','פורסם'].includes(t.status)}function late(t){return overdue(t)?("<span class=\"late\">" + uiText("◷ באיחור") + "</span>"):''}function pname(id){return S.papers.find(p=>p.id===id)?.title||uiText('כללי')}
function progress(p){let a=[...S.tasks.filter(x=>x.paperId===p.id),...S.chapters.filter(x=>x.paperId===p.id)],n=a.filter(x=>x.status==='הושלם').length;return {n,total:a.length,pct:a.length?Math.round(n/a.length*100):0}}function next(p, fallback='טרם הוגדרה משימה הבאה'){return S.tasks.filter(x=>x.paperId===p.id&&x.status!=='הושלם').sort((a,b)=>(a.due||'9999').localeCompare(b.due||'9999'))[0]?.title||fallback}
function empty(s='אין רשומות עדיין. הוסיפו רשומה כדי להתחיל.'){return `<div class="empty">${uiText(s)}</div>`}function action(label,js,cls=''){return `<button type="button" class="${cls}" onclick="${js}">${uiText(label)}</button>`}
function toolbar(extra=''){return `<div class="toolbar"><input aria-label="${uiText("חיפוש")}" placeholder="${uiText("חיפוש ברשומות…")}" value="${esc(q)}" oninput="q=this.value;renderBody()"><select aria-label="${uiText("סינון")}" onchange="filter=this.value;renderBody()"><option value="">${uiText("כל הרשומות")}</option>${extra}</select><select aria-label="${uiText("מיון")}" onchange="sort=this.value;renderBody()"><option value="updated">${uiText("עדכון אחרון")}</option><option value="title" ${sort==='title'?'selected':''}>${uiText("שם")}</option><option value="due" ${sort==='due'?'selected':''}>${uiText("מועד יעד")}</option></select></div>`}
function opts(values, localize = true) {
  return values.map(value => `<option value="${esc(value)}" ${filter === value ? 'selected' : ''}>${esc(localize ? uiText(value) : value)}</option>`).join('');
}
function workspaceFilterOptions() {
  const predefined = [...statuses, ...priority];
  const custom = [...new Set([
    ...S.papers.map(p => p.topic),
    ...S.papers.flatMap(p => (p.partners || '').split(',')),
    ...S.opportunities.map(o => o.field)
  ].filter(Boolean))];
  return opts(predefined) + opts(custom.filter(value => !predefined.includes(value) || value !== uiText(value)), false);
}
function uiPaperLanguage(value) {
  const names = { 'עברית':'עברית', 'العربية':'ערבית', 'ערבית':'ערבית', 'English':'אנגלית', 'אנגלית':'אנגלית' };
  return window.MerhavUI && window.MerhavUI.language !== 'he' && Object.hasOwn(names, value) ? uiText(names[value]) : value;
}
function matches(x){return JSON.stringify(x).toLowerCase().includes(q.toLowerCase())&&(!filter||Object.values(x).some(v=>Array.isArray(v)?v.includes(filter):v===filter))}function sorted(a){return a.filter(matches).sort((a,b)=>sort==='title'?(a.title||a.name||'').localeCompare(b.title||b.name||'','he'):sort==='due'?(a.due||'9999').localeCompare(b.due||'9999'):(b.updated||b.date||'').localeCompare(a.updated||a.date||''))}

function renderBody(){S.requirements??=[];let h='';if(paperId)h=paper();else if(view==='dashboard')h=dashboard();else if(view==='papers')h=researchLibrary();else if(view==='tasks')h=tasks();else if(view==='gantt')h=gantt();else if(view==='files')h=files();else if(view==='chat')h=researchChat();else if(view==='activity')h=activity();else if(view==='settings')h=backupCenter();else h=records(view);$('#body').innerHTML=h;bindDrag()}
function paperCard(p){let v=progress(p);return `<article class="card research-card"><div class="row"><span class="eyebrow">${esc(p.code)}</span>${badge(p.work)}${late(p)}</div><h2 title="${esc(p.title)}"><a href="#" onclick="openPaper('${p.id}');return false">${esc(p.title)}</a></h2><div class="muted">${esc(p.topic||uiText('נושא לא הוזן'))} · ${esc(uiPaperLanguage(p.language))}<br>${esc(p.partners||uiText('שותפים לא הוזנו'))}</div><p>${esc(displayChoice(p.status,statuses))} ${uiText("· יעד")} ${date(p.due)}</p><progress value="${v.pct}" max="100"></progress><div class="muted">${v.n}/${v.total} ${uiText("משימות ופרקים הושלמו")} ${v.total?'· '+v.pct+'%':''}</div><p>${uiText("הצעד הבא:")} ${esc(next(p,uiText('טרם הוגדרה משימה הבאה')))}</p><div class="card-actions">${action(uiText('פתיחת מחקר ←'),`openPaper('${p.id}')`)}${action(uiText('✎ עריכת מחקר'),`edit('papers','${p.id}')`,'edit-action')}<span class="card-update">${uiText("עודכן")} ${date(p.updated)}</span></div></article>`}

/* workspace-studio */

let workspaceChapterId = '';

function toggleWorkspaceMenu(button) {
  const open = button.getAttribute('aria-expanded') !== 'true';
  document.body.classList.toggle('workspace-nav-open', open);
  button.setAttribute('aria-expanded', String(open));
}

function workspaceIcon(key, fallback='') {
  const shapes = {
    dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',
    papers:'M5 3h10l4 4v14H5z M14 3v5h5 M8 12h8 M8 16h6',
    tasks:'M5 3h14v18H5z M8 12l3 3 5-6',
    gantt:'M5 4v16h15 M8 8h5 M11 12h8 M8 16h6',
    sources:'M3 5h7l2 2 2-2h7v14h-7l-2 2-2-2H3z M12 7v14',
    files:'M3 7V5h6l3 3h9v12H3z',
    analyses:'M4 4v16h17 M8 15l4-4 4 2 4-6',
    tools:'M9 3h6 M10 3v7l-5 8a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-8V3 M8 15h8',
    opportunities:'M4 4l17 8-17 8 3-8z M7 12h14',
    activity:'M21 12a9 9 0 1 1-2-6 M12 7v6l4 2 M21 3v4h-4',
    chat:'M4 5h16v12H9l-5 4z M8 9h8 M8 13h6',
    settings:'M12 3l8 4v10l-8 4-8-4V7z M15 12a3 3 0 1 1-6 0 3 3 0 1 1 6 0',
    writing:'M4 20l4-1L20 7l-3-3L5 16z M14 7l3 3',
    clock:'M21 12a9 9 0 1 1-18 0 9 9 0 1 1 18 0 M12 7v5l3 2'
  };
  return shapes[key] ? `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${shapes[key]}"/></svg>` : fallback;
}

function renderWorkspaceProject() {
  const slot = $('#workspace-project');
  if (!slot) return;
  if (view === 'chat') {
    slot.innerHTML = `<label class="workspace-project"><span>${uiText('המחקר הפעיל')}</span><select onchange="openResearchChat(this.value)">
      <option value="">${uiText('כל המאמרים')}</option>
      ${S.papers.map(p=>`<option value="${esc(p.id)}" ${p.id===chatPaperId?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label>`;
    return;
  }
  const active = S.papers.filter(p => !p.archived && !p.archivedAt);
  const current = S.papers.find(p => p.id === paperId)
    || active.find(p => p.id === S.chapters.find(c => c.id === workspaceChapterId)?.paperId)
    || active[0];
  slot.innerHTML = current
    ? `<label class="workspace-project"><span>${uiText("המחקר הפעיל")}</span><select onchange="openPaper(this.value)">${(active.includes(current) ? active : [current,...active]).map(p => `<option value="${esc(p.id)}" ${p===current?'selected':''}>${esc(p.title)}</option>`).join('')}</select></label>`
    : '';
}

function dashboardWritingWorkbench() {
  const papers = new Map(S.papers.filter(p => !p.archived && !p.archivedAt).map(p => [p.id, p]));
  const chapters = S.chapters.filter(c => papers.has(c.paperId)).sort((a, b) =>
    Number(a.status === 'הושלם') - Number(b.status === 'הושלם') ||
    String(b.updated || '').localeCompare(String(a.updated || '')) ||
    (a.order || 0) - (b.order || 0)
  );
  const chapter = chapters.find(c => String(c.id) === workspaceChapterId) || chapters[0];
  if (!chapter) return '';
  const paper = papers.get(chapter.paperId);
  const outline = chapters.filter(c => c.paperId === paper.id).sort((a,b) => (a.order || 0) - (b.order || 0));
  const roots = outline.filter(c => !c.parentId);
  const status = chapter.updated ? uiText('נשמר') + ' ' + date(chapter.updated) : displayChoice(chapter.status,work,'פרק במחקר');
  const text = String(chapter.content || '').trim();
  const excerpt = text.length > 560 ? text.slice(0,560).trimEnd() + '…' : text;
  return `<section class="writing-workbench" id="writing-workbench" aria-labelledby="writing-workbench-title">
    <div class="writing-banner">
      <h2 id="writing-workbench-title">${workspaceIcon('writing')} ${uiText("ממשיכים לכתוב")}</h2>
      <span class="writing-saved">${esc(status)}</span>
    </div>
    <div class="writing-columns">
      <div class="writing-article">
        <div class="writing-heading">
          <div><span class="writing-context">${esc(paper.title)}</span><h3>${esc(chapter.title)}</h3></div>
          <label class="writing-picker" for="workspace-chapter">${uiText("בחירת פרק")}
            <select id="workspace-chapter" onchange="selectWorkspaceChapter(this.value)">
              ${chapters.map(c => `<option value="${esc(c.id)}" ${c===chapter?'selected':''}>${esc(papers.get(c.paperId).title + ' · ' + c.title)}</option>`).join('')}
            </select>
          </label>
        </div>
        <div class="writing-preview"><span class="writing-preview-label">${workspaceIcon('papers')} ${uiText("טיוטת הפרק")}</span><p class="writing-excerpt" dir="auto">${esc(excerpt || uiText('טרם נכתב תוכן בפרק הזה.'))}</p></div>
        <button type="button" class="primary writing-open" data-paper="${esc(paper.id)}" data-chapter="${esc(chapter.id)}" onclick="openWorkspaceChapter(this.dataset.paper,this.dataset.chapter)">${workspaceIcon('writing')} ${uiText("פתיחת הפרק לעריכה")}</button>
      </div>
      <section class="writing-outline" aria-label="${uiText("מבנה כתב היד")}"><header><h3>${uiText("מבנה כתב היד")}</h3><span>${outline.filter(c => c.status==='הושלם').length}/${outline.length} ${uiText("פרקים הושלמו")}</span></header>
        <ul>${(roots.length ? roots : outline).slice(0,6).map(c => `<li><button type="button" class="${c===chapter?'current':''}" ${c===chapter?'aria-current="true"':''} value="${esc(c.id)}" onclick="selectWorkspaceChapter(this.value)"><span>${esc(c.title)}</span><small>${esc(displayChoice(c.status,work,'טיוטה'))}</small></button></li>`).join('')}</ul>
        <button type="button" class="writing-outline-all" data-paper="${esc(paper.id)}" onclick="openPaperTab(this.dataset.paper,'chapters')">${uiText("כל פרקי המחקר ←")}</button>
      </section>
    </div>
  </section>`;
}
function selectWorkspaceChapter(value) {
  workspaceChapterId = value;
  const fromOutline = document.activeElement?.closest('.writing-outline');
  $('#writing-workbench').outerHTML = dashboardWritingWorkbench();
  renderWorkspaceProject();
  $(fromOutline ? '.writing-outline button[aria-current]' : '#workspace-chapter')?.focus();
}

function openWorkspaceChapter(researchId, chapterId) {
  const chapter = S.chapters.find(c => String(c.id) === chapterId && String(c.paperId) === researchId);
  if (!chapter || !S.papers.some(p => p.id === chapter.paperId)) return;
  workspaceChapterId = String(chapter.id);
  openPaperTab(chapter.paperId,'chapters');
  edit('chapters', chapter.id);
}

function openPaperTab(researchId, section) {
  if (!S.papers.some(p => p.id === researchId)) return;
  openPaper(researchId);
  tab = section;
  renderBody();
}


function styleWorkspaceEditor(chapterId, initialPaperId) {
  const form = $('#editor');
  const content = form?.elements?.content;
  if (!content?.closest) return;
  const chapter = S.chapters.find(c=>c.id===chapterId);
  const owner = chapter?.paperId || initialPaperId || paperId;
  const research = S.papers.find(p=>p.id===owner);
  const outline = S.chapters.filter(c=>c.paperId===owner).sort((a,b)=>(a.order||0)-(b.order||0));
  const sources = chapterEvidence(owner, chapterId);
  const files = S.files.filter(f=>!f.sensitive && (chapterId ? f.chapterId===chapterId : owner && f.paperId===owner));
  const field = content.closest('label');
  const layout = document.createElement('div');
  layout.className = 'workspace-editor-layout';
  layout.innerHTML = `<details class="workspace-editor-outline" open><summary>${uiText("מבנה כתב היד")}</summary><ul class="workspace-list">${outline.map(c=>`<li ${c.id===chapterId?'aria-current="true"':''}><span>${esc(c.title)}</span></li>`).join('')}</ul></details>
    <div class="workspace-editor-desk"><div class="workspace-editor-paper"><span>${esc(research?.title || '')}</span><h3>${esc(chapter?.title || uiText('פרק חדש'))}</h3></div></div>
    <section class="workspace-editor-context" aria-labelledby="studio-evidence-heading"><h3 id="studio-evidence-heading">${workspaceIcon('sources')} ${uiText("חומרי המחקר")}</h3><h4>${uiText("מקורות")}</h4>${sources.length ? sources.map(source=>sourcePick(source)).join('') : ("<p class=\"muted\">" + uiText("טרם שויכו מקורות.") + "</p>")}<h4>${uiText("קבצים מקושרים")}</h4>${workspaceFileList(files)}</section>`;
  form.classList.add('workspace-editor');
  form.dataset.chapterId = chapterId ?? '';
  form.dataset.paperId = owner || '';
  const evidenceButton = document.createElement('button');
  evidenceButton.type = 'button';
  evidenceButton.className = 'studio-evidence-toggle';
  evidenceButton.dataset.evidenceOpen = '';
  evidenceButton.setAttribute('aria-haspopup', 'dialog');
  evidenceButton.setAttribute('aria-controls', 'aurora-evidence');
  evidenceButton.innerHTML = workspaceIcon('sources') + ' חומרי המחקר';
  form.querySelector('.modalfoot').append(evidenceButton);
  form.querySelector('.formgrid').before(layout);
  const desk = layout.querySelector('.workspace-editor-paper');
  desk.append(field);
  layout.before(form.querySelector('.modalfoot'));
  const heading = desk.querySelector('h3');
  heading.tabIndex = -1;
  heading.focus({preventScroll:true});
  $('#modal').scrollTop = 0;
}

const dashboardTitle = 'שולחן המחקר';
const dashboardSubtitle = 'כתיבה, משימות וחומרי מחקר במקום אחד.';

function dashboard() {
  const open = S.tasks.filter(t => t.status!=='הושלם');
  const lateTasks = open.filter(overdue).sort((a,b)=>a.due.localeCompare(b.due));
  const week = new Date();
  week.setDate(week.getDate()+7);
  const endOfWeek = week.toISOString().slice(0,10);
  const near = open.filter(t=>t.due && t.due>=today() && t.due<=endOfWeek).sort((a,b)=>a.due.localeCompare(b.due));
  const stale = S.papers.filter(p=>Date.now()-new Date(p.updated)>30*864e5);
  const recentFiles = S.files.filter(f=>!f.sensitive).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))).slice(0,5);
  const config = S.dashboard || {};
  const dateLabel = new Intl.DateTimeFormat(uiLocale(),{timeZone:'Asia/Jerusalem',weekday:'long',day:'numeric',month:'long'}).format(new Date());
  const metrics = [
    ['מחקרים פעילים',S.papers.filter(p=>p.status!=='פורסם').length,'papers',''],
    ['משימות לשבוע הקרוב',near.length,'tasks','teal'],
    ['משימות באיחור',lateTasks.length,'clock','coral'],
    ['ללא עדכון 30 יום',stale.length,'activity','purple'],
    ['סיכום שבועי','פתיחה','gantt','weekly']
  ];
  return `<section class="dashboard-hero desk-intro"><div class="desk-intro-copy">
    <time datetime="${today()}">${workspaceIcon('clock')} ${esc(dateLabel)}</time>
    <h2>${esc(config.title || uiText(dashboardTitle))}</h2><p>${esc(config.subtitle || uiText(dashboardSubtitle))}</p></div>
    <div class="desk-intro-tools">${action(uiText('＋ מחקר חדש'),"edit('papers')",'primary')}
      <details class="desk-actions"><summary>${uiText('אפשרויות תצוגה')}</summary><div>
      ${action(uiText('עריכת לוח הבקרה'),'editDashboard()')}${action(uiText('ריענון האפליקציה'),'location.reload()')}
      ${action(uiText('פתיחה בחלון נפרד'),'openAppWindow()')}</div></details></div></section>
  ${deskStudyDeck()}
  ${dashboardWritingWorkbench() || `<section class="writing-workbench desk-start" aria-labelledby="desk-start-title">
    <div class="desk-start-body">
      <span class="desk-start-icon">${workspaceIcon('writing')}</span>
      <div><h2 id="desk-start-title">${S.papers.length?uiText('כאן ממשיכים לכתוב'):uiText('המחקר הראשון מתחיל כאן')}</h2>
        <p>${S.papers.length?uiText('פתחו מחקר והוסיפו לו פרק. הטיוטה האחרונה תופיע כאן.'):uiText('אחרי שתוסיפו מחקר, תוכלו לחזור מכאן לפרק האחרון, למשימות ולקבצים שלו.')}</p>
      </div>
    </div>
    ${S.papers.length
      ? action(uiText('למחקרים שלי'),"go('papers')",'primary')
      : action(uiText('שחזור מגיבוי קיים'),"go('settings')",'desk-restore')}
  </section>`}
  <section class="metric-strip" aria-label="${uiText("סיכום המחקרים והמשימות")}">${metrics.map(([label,value,icon,tone])=>`<button type="button" onclick="openDashboardMetric('${tone}')" aria-label="${esc(uiText('פתיחת')+' '+uiText(label))}" class="metric-tile ${tone}"><span class="metric-icon" aria-hidden="true">${workspaceIcon(icon)}</span><div><small>${uiText(label)}</small><strong>${typeof value === "string" ? uiText(value) : value}</strong></div></button>`).join('')}</section>

  <div class="split dashboard-detail">
    <section class="panel"><h3>${uiText("אבני דרך ומשימות קרובות")}</h3>${[...lateTasks,...near].map(taskCard).join('') || empty(uiText('אין משימות להצגה.'))}</section>
    <div>
      <section class="panel"><h3>${uiText("קבצים מקומיים אחרונים")}</h3>${workspaceFileList(recentFiles)}</section>
      ${stale.length ? `<section class="panel"><h3>${uiText("מחקרים שמחכים לעדכון")}</h3><ul class="workspace-list">${stale.map(p=>`<li><button type="button" class="workspace-back" data-project="${esc(p.id)}" onclick="edit('papers',this.dataset.project)">${esc(p.title)}</button><small>${esc(date(p.updated))}</small></li>`).join('')}</ul></section>` : ''}
    </div>
  </div>`;
}
function editDashboard(){const config=S.dashboard||{};$('#modal').innerHTML=`<h2>${uiText("עריכת לוח הבקרה")}</h2><p class="muted">${uiText("התאימו את הכותרת והתיאור. פרטי כל מחקר ניתנים לעריכה מתוך הכרטיס שלו.")}</p><form id="dashboard-editor"><label class="field">${uiText("כותרת עליונה")}<input name="title" required maxlength="120" value="${esc(config.title||dashboardTitle)}"></label><label class="field" style="margin-top:16px">${uiText("תיאור קצר")}<textarea name="subtitle" maxlength="500">${esc(config.subtitle||dashboardSubtitle)}</textarea></label><div class="modalfoot">${action(uiText('ביטול'),"document.querySelector('#modal').close()")}<button type="submit" class="primary">${uiText("שמירת לוח הבקרה")}</button></div></form>`;$('#modal').showModal();$('#dashboard-editor').onsubmit=async e=>{e.preventDefault();const form=new FormData(e.target);S.dashboard={...config,title:form.get('title').trim(),subtitle:form.get('subtitle').trim()};try{await persist();$('#modal').close();render();toast(uiText('לוח הבקרה עודכן ונשמר'))}catch{}}}
function workspaceFileList(files) {
  if (!files.length) return ("<p class=\"muted\">" + uiText("טרם צורפו קבצים.") + "</p>");
  return `<ul class="workspace-list">${files.map(f => `<li>${workspaceIcon('files')}<a href="/api/file/${encodeURIComponent(f.id)}" dir="auto">${esc(f.name)}</a><small>${esc(date(f.date))}</small></li>`).join('')}</ul>`;
}

function paper() {
  const p = S.papers.find(p => p.id===paperId);
  const tabs = {overview:'סקירה כללית',chapters:'פרקים וכתיבה',tasks:'משימות',gantt:'גאנט',notes:'תיעוד והחלטות',files:'קבצים',submissions:'הגשות ושופטים'};
  const chapterList = S.chapters.filter(c=>c.paperId===p.id).sort((a,b)=>(a.order||0)-(b.order||0));
  const sources = S.sources.filter(s=>s.paperId===p.id || s.paperIds?.includes(p.id));
  const linkedFiles = S.files.filter(f=>f.paperId===p.id && !f.sensitive).sort((a,b)=>
    Number(b.id===p.workingFileId) - Number(a.id===p.workingFileId) || String(b.date||'').localeCompare(String(a.date||''))
  );
  const current = chapterList.find(c => String(c.id) === workspaceChapterId) || chapterList.find(c=>c.status!=='הושלם') || chapterList[0];
  return `<section class="workspace-project-hero">
    <div class="workspace-project-path">${action(uiText('המחקרים שלי'),"go('papers')",'workspace-back')} <span aria-hidden="true">‹</span> <span>${esc(uiText(tabs[tab]))}</span></div>
    <div class="workspace-project-heading"><h2>${esc(p.title)}</h2><div class="row">${badge(p.work)}<span class="tag">${esc(displayChoice(p.status,statuses))}</span>${late(p)}</div></div>
    <div class="workspace-project-actions row">${action(uiText('עריכת מחקר'),`edit('papers','${p.id}')`)}${action(uiText('סיום מפגש ושמירת Word'),`endSession('${p.id}')`)}${current ? `<button type="button" class="primary" data-paper="${esc(p.id)}" data-chapter="${esc(current.id)}" onclick="openWorkspaceChapter(this.dataset.paper,this.dataset.chapter)">${workspaceIcon('writing')} ${uiText("המשך כתיבה בטיוטה")}</button>` : ''}</div>
    ${tab==='overview' ? `<dl class="workspace-project-meta">${[['צוות המחקר',p.partners],['יעד פרסום',p.journal],['מועד יעד',p.due && date(p.due)]].filter(([,value])=>value).map(([label,value])=>`<div><dt>${uiText(label)}</dt><dd dir="auto">${esc(value)}</dd></div>`).join('')}</dl>` : ''}
  </section>
  <nav class="tabs workspace-project-tabs" aria-label="${uiText("אזורי המחקר")}">${Object.entries(tabs).map(([key,label])=>`<button type="button" data-paper-tab="${key}" class="${tab===key?'active':''}" ${tab===key?'aria-current="page"':''} onclick="switchPaperTab(this)">${uiText(label)}</button>`).join('')}</nav>
  <div class="aurora-tab-content">${tab==='overview' ? `<div class="row workspace-stages">${statuses.map(s=>`<span class="stage ${s===p.status?'current':''}">${s}</span>`).join('')}</div>
  <div class="workspace-project-grid">
    <div>
      <section class="panel"><h3>${workspaceIcon('papers')} ${uiText("פרקי כתב היד")}</h3>
        ${chapterList.length ? `<ul class="workspace-list">${chapterList.slice(0,8).map(c=>`<li><button type="button" class="workspace-back" data-paper="${esc(p.id)}" data-chapter="${esc(c.id)}" onclick="openWorkspaceChapter(this.dataset.paper,this.dataset.chapter)">${esc(c.title)}</button><small>${esc(displayChoice(c.status,work,'טיוטה'))}</small></li>`).join('')}</ul>` : ("<p class=\"muted\">" + uiText("טרם נוספו פרקים.") + "</p>")}

function quick() {
  const items = [
    ['papers','papers',labels.papers],
    ['tasks','tasks',labels.tasks],
    ['notes','writing',labels.notes],
    ['tools','tools',labels.tools],
    ['sources','sources',labels.sources],
    ['opportunities','opportunities',labels.opportunities],
    ['files','files','צירוף קובץ']

  const planets = items.map(([kind,icon,label],index) => {
    const drift = `--float-x:${Math.round(Math.random()*12-6)}px;--float-y:${Math.round(Math.random()*12-6)}px;--float-turn:${(Math.random()*3-1.5).toFixed(1)}deg;--float-time:${(5+Math.random()*4).toFixed(1)}s;--float-delay:-${(Math.random()*8).toFixed(1)}s`;
    return `<button type="button" class="quick-planet planet-${index}" data-quick-kind="${kind}" style="${drift}"
      onclick="document.querySelector('#modal').close();${kind === 'files' ? 'uploadFile()' : `edit('${kind}')`}">
      <span class="quick-sphere">${workspaceIcon(icon)}<span>${esc(uiText(label))}</span></span></button>`;
  }).join('');
  $('#modal').innerHTML=`<section class="quick-orbit" aria-labelledby="quick-title" data-motion="on">
    <header class="quick-orbit-header"><h2 id="quick-title">${uiText('הוספה מהירה')}</h2><div>
      <button type="button" class="quick-utility quick-motion" title="${uiText('השהיית תנועה')}" aria-label="${uiText('השהיית תנועה')}" onclick="toggleQuickMotion(this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path class="quick-pause" d="M9 5v14M15 5v14"/><path class="quick-play" d="m9 5 10 7-10 7z"/></svg>
      </button>
      <button type="button" class="quick-utility" title="${uiText('סגירה')}" aria-label="${uiText('סגירה')}" onclick="document.querySelector('#modal').close()" autofocus>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </div></header><div class="quick-orbit-field">${planets}</div>
  </section>`;
  $('#modal').showModal();

function toggleQuickMotion(button) {
  const orbit=button.closest('.quick-orbit');
  const paused=orbit.dataset.motion==='on';
  orbit.dataset.motion=paused ? 'off' : 'on';
  button.title=button.ariaLabel=uiText(paused ? 'הפעלת תנועה' : 'השהיית תנועה');
}

let signingOut = false;
async function signOut() {
  if (signingOut) return;
  signingOut = true;
  const buttons = document.querySelectorAll('[data-workspace-logout]');
  buttons.forEach(button => { button.disabled = true; button.setAttribute('aria-busy','true'); });
  try {
    await mutationQueue.catch(() => {});
    const result = await api('/auth/logout',{});
    location.replace(result.redirect || '/');
  } catch {
    toast(uiText('היציאה לא הושלמה. נסו שוב.'),true);
  } finally {
    signingOut = false;
    buttons.forEach(button => { button.disabled = false; button.removeAttribute('aria-busy'); });
  }
}

const baseEdit=edit;
edit=function(kind,id,initial={}){
 const key=kind+':'+(id||'new')+':'+paperId;
 S.drafts??=[];
 let stored=S.drafts.find(d=>d.key===key),local;
 try{local=JSON.parse(localStorage.getItem('postdoc-draft:'+key)||'null')}catch{}
 let draft=local&&(!stored||local.date>stored.date)?local:stored;
 baseEdit(kind,id,initial);
 const form=$('#editor');
 if(draft){for(let [k,v]of Object.entries(draft.data)){let el=form.elements[k];if(!el)continue;if(el.multiple){for(let o of el.options)o.selected=(v||[]).includes(o.value)}else el.value=v}toast(uiText('שוחזרה טיוטת עריכה שנשמרה אוטומטית'))}
 if(kind==='chapters'){let help=document.createElement('p');help.className='muted';help.textContent=uiText('עיצוב Word: כותרת משנה מתחילה ב־## ורווח; הדגשה נכתבת בין **כוכביות כפולות**; לטבלה כתבו כל שורה כך: | עמודה ראשונה | עמודה שנייה |. כיתובים, ציטוטים ומקורות נשמרים כפי שהוזנו, ללא השלמת מידע.');form.append(help)}
 if(form.elements.paperId){form.elements.paperId.addEventListener('change',()=>{for(let [key,,type]of schemas[kind])if(['chapters','tasks','notes','files'].includes(type)&&form.elements[key])form.elements[key].innerHTML=("<option value=\"\">" + uiText("לא הוזן") + "</option>")+refOptions(type,{id,paperId:form.elements.paperId.value}).map(([k,v])=>`<option value="${esc(k)}">${esc(v)}</option>`).join('')})}
 let hint=document.createElement('p');hint.className='muted';hint.textContent=uiText('שמירת טיוטה אוטומטית פעילה במחשב זה. לחצו שמירה להחלת השינויים ברשומות.');form.append(hint);
 form.dataset.draftKey=key;let timer,finished=false,submitting=false;
 const snapshot=()=>{let data=Object.fromEntries(new FormData(form));for(let [k,,t]of schemas[kind])if(t==='multipapers')data[k]=[...form.elements[k].selectedOptions].map(o=>o.value);return {key,date:now(),data}};
 async function flush(){if(finished||submitting)return;let d=snapshot();try{try{localStorage.setItem('postdoc-draft:'+key,JSON.stringify(d))}catch{}hint.textContent=uiText('שומר טיוטה…');let state=await queuedMutation('/api/draft',{draft:d});acceptSavedState(state);if(!submitting&&!finished)hint.textContent='הטיוטה נשמרה אוטומטית במחשב · '+new Date().toLocaleTimeString(uiLocale())}catch(e){hint.textContent='הטיוטה נשמרה בדפדפן; שמירה במחשב דורשת ניסיון חוזר: '+e.message}}
 form.addEventListener('input',()=>{let d=snapshot();try{localStorage.setItem('postdoc-draft:'+key,JSON.stringify(d))}catch{}clearTimeout(timer);timer=setTimeout(flush,800)});
 form.addEventListener('change',()=>{clearTimeout(timer);timer=setTimeout(flush,500)});
 const submit=form.onsubmit;form.onsubmit=async e=>{e.preventDefault();if(submitting)return;clearTimeout(timer);submitting=true;let button=form.querySelector('button[type=submit]');if(button){button.disabled=true;button.textContent=uiText('שומר…')}hint.textContent=uiText('שומר את השינויים…');try{await submit(e);if(!$('#modal').open){finished=true;try{localStorage.removeItem('postdoc-draft:'+key)}catch{}}else hint.textContent=uiText('השמירה לא הושלמה. הטיוטה נשמרה; אפשר לתקן ולנסות שוב.')}finally{submitting=false;if(button){button.disabled=false;button.textContent=uiText('שמירה')}}};
 $('#modal').addEventListener('close',()=>{clearTimeout(timer);if(!finished&&!submitting)flush()},{once:true});
};

var ResearchPlanner=(()=>{
 const sources={quant:'https://stats.oarc.ucla.edu/other/mult-pkg/whatstat/',qual:'https://www.thematicanalysis.net/understanding-ta/',mixed:'https://obssr.od.nih.gov/research-resources/mixed-methods-research'};

   else if(d.qualGoal==='framework')add('ניתוח מסגרת / תוכן איכותני','נבחרה השוואה בין מקרים או בחינה של מסגרת קיימת.','מסגרת קידוד מנומקת, יחידות ניתוח ותיעוד התאמות לקודים.','ניתוח תמטי רפלקסיבי כשפיתוח המשמעות פתוח יותר.','מסגרת מוקדמת עשויה להסתיר תופעות שאינן מתאימות לה.');
   else add('ניתוח תמטי רפלקסיבי','נבחר חיפוש דפוסי משמעות בחומר האיכותני סביב '+d.variables,'עמדה תאורטית ורפלקסיביות מפורשות, היכרות מעמיקה עם החומר ופיתוח תמות מעבר לרשימת נושאים.','ניתוח מסגרת, נרטיבי או תוכן בהתאם לשאלה.','אין להניח שהסכמה בין מקודדים היא תנאי מחייב לגישה רפלקסיבית. תמות הן פרשנות, לא שכיחות בלבד.');

   const dep=d.dependence!=='independent',ordinal=d.outcome==='ordinal';
   if(d.goal==='describe')add('סטטיסטיקה תיאורית והצגת התפלגויות','המטרה שנבחרה היא תיאור הנתונים, ללא בדיקת קשר או הבדל.','שכיחויות לקטגוריות; מדדי מרכז ופיזור המתאימים לסולם, חסרים וערכים חריגים.','ניתוח מסיק רק אם נוסחה שאלה מסיקה ומערך מתאים.','תיאור מדגם אינו מוכיח סיבתיות או ייצוגיות.');
   else if(d.outcome==='binary'||d.outcome==='categorical'){
    if(d.goal==='difference'&&d.dependence==='paired'&&d.outcome==='binary')add('McNemar לתוצאה בינארית מזווגת','אותם נבדקים נמדדים בשתי נקודות בתוצאה בינארית.','שתי מדידות מזווגות; בדיקת מספר הזוגות הלא תואמים ושימוש בגרסה מדויקת לפי הצורך.','מודל לוגיסטי למדידות חוזרות כשיש יותר משתי מדידות או מסבירים.','אינו מיועד לקבוצות עצמאיות או לתוצאה עם יותר משתי קטגוריות.');
    else if(d.goal==='difference'&&!dep)add('חי־בריבוע / Fisher','נבחרה השוואה של שכיחויות בין קבוצות עצמאיות.','ספירות ולא אחוזים; בדיקת התאים הצפויים. Fisher מתאים במיוחד לטבלת 2×2 דלילה.','רגרסיה לוגיסטית לבקרה על מסבירים; שיטה מדויקת לטבלה גדולה לפי הצורך.','לא למדידות תלויות; הבדל בשכיחויות אינו עדות סיבתית.');
    else add(dep?'מודל לוגיסטי חוזר / רב־רמתי':d.outcome==='binary'?'רגרסיה לוגיסטית בינארית':'רגרסיה לוגיסטית מולטינומית','משתנה התוצאה קטגוריאלי ונדרשת בחינת מסבירים.','גודל מדגם ואירועים מספקים ביחס לפרמטרים; לבדוק הפרדה, קידוד ויחסי תלות.','ניתוח קטגוריאלי פשוט או מודל סדור אם הקטגוריות מסודרות.','מודלים מורכבים רגישים לדלילות. אומדני הסתברות או יחס סיכויים אינם סיבתיות.');
   }else if(d.outcome==='count')add(dep?'מודל ספירות חוזר / רב־רמתי':'מודל Poisson או בינומי שלילי','התוצאה היא מספר אירועים או מופעים.','ספירות שלמות לא שליליות; לבדוק פיזור יתר, עודף אפסים וזמן חשיפה.','מודל בינומי שלילי או מודל אפסים רק לאחר הצדקה.','אין לבחור מודל ספירות על סמך מספר קטגוריות של סולם בלבד.');

   }else if(d.goal==='association'&&!dep)add(ordinal?'מתאם Spearman':'מתאם Pearson או Spearman','נבחרה בחינת קשר בין משתנים סביב '+d.variables,'לבחון תרשים פיזור, ליניאריות ל־Pearson או מונוטוניות ל־Spearman, חריגים ואי־תלות.','רגרסיה לבקרה על מסבירים או מודל חוזר לנתונים תלויים.','מתאם אינו מוכיח סיבתיות; קשר לא ליניארי עשוי לא להתבטא במקדם יחיד.');
   else add(dep?'מודל ליניארי מעורב / רב־רמתי':ordinal?'רגרסיה סדורה':'רגרסיה ליניארית','נבחרה בחינת מסבירים או חיזוי של '+d.outcome+' עם '+d.variables,'להגדיר מודל מראש, לבדוק שאריות, קידוד, רב־קולינאריות, תלות ונתונים חסרים; בחיזוי להפריד אימון והערכה.','מודל חסין, לא ליניארי או סדור בהתאם לתוצאה.','התאמה למדגם אינה ביצועי חיזוי חיצוניים; מערך תצפיתי אינו מוכיח סיבתיות.');
  }

 }
 const topics=[['ai',/בינה|מלאכות|\bai\b|artificial|ذكاء/i],['attitude',/עמד|אמונ|תפיס|attitud|belief|تصور|اتجاه/i],['trust',/אמון|trust|ثقة/i],['accept',/אימוץ|קבל|תועלת|accept|adopt|useful|قبول/i],['critical',/ביקורת|critical|ناقد|نقد/i],['memory',/זיכרון|זכרון|memory|ذاكرة/i],['attention',/קשב|ריכוז|attent|concentr|انتباه|تركيز/i],['mood',/מצב רוח|רגש|mood|affect|مزاج/i],['efficacy',/מסוגל|efficacy|كفاءة/i],['knowledge',/אוריינ|ידע|literacy|knowledge|معرفة/i],['professional',/מקצוע|professional|مهني/i]];

function analyzeResearchRows(headers,rows){const columns=headers.map((name,j)=>{const values=rows.map(r=>String(r[j]??'').trim()),valid=values.filter(Boolean),numeric=valid.map(v=>/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(v)?Number(v):NaN),isNumeric=valid.length>0&&numeric.every(Number.isFinite),counts=new Map();for(const v of valid)counts.set(v,(counts.get(v)||0)+1);const freq=[...counts].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'he'));if(isNumeric){const x=numeric.slice().sort((a,b)=>a-b),sum=x.reduce((a,b)=>a+b,0),median=x.length%2?x[(x.length-1)/2]:(x[x.length/2-1]+x[x.length/2])/2,mean=sum/x.length,variance=x.length>1?x.reduce((a,v)=>a+(v-mean)**2,0)/(x.length-1):null,sd=variance===null?null:Math.sqrt(variance),maxFrequency=freq[0]?.[1]||0,mode=maxFrequency>1?freq.filter(([,n])=>n===maxFrequency).map(([v])=>v):[];return {name,type:'numeric',n:x.length,missing:values.length-x.length,unique:counts.size,min:x[0],max:x[x.length-1],range:x[x.length-1]-x[0],mean,median,mode,variance,sd,frequencies:freq.slice(0,6)}}return {name,type:'categorical',n:valid.length,missing:values.length-valid.length,unique:counts.size,mode:freq.length&&freq[0][1]>1?freq.filter(([,n])=>n===freq[0][1]).map(([v])=>v):[],frequencies:freq.slice(0,6)}});const missing=columns.reduce((n,c)=>n+c.missing,0),total=rows.length*headers.length;return {rows:rows.length,columns:headers.length,missing,missingPct:total?missing/total*100:0,duplicateRows:rows.length-new Set(rows.map(r=>JSON.stringify(r))).size,variables:columns}}

// A general, opt-in Pearson tool. Numeric columns are never assumed to be interval data.
let statisticsPearsonResult=null;
function pearsonLogGamma(z){const p=[676.5203681218851,-1259.1392167224028,771.3234287776531,-176.6150291621406,12.507343278686905,-0.13857109526572012,9.984369578019572e-6,1.5056327351493116e-7];if(z<0.5)return Math.log(Math.PI)-Math.log(Math.sin(Math.PI*z))-pearsonLogGamma(1-z);z-=1;let x=0.9999999999998099;for(let i=0;i<p.length;i++)x+=p[i]/(z+i+1);const t=z+p.length-0.5;return 0.9189385332046727+(z+0.5)*Math.log(t)-t+Math.log(x)}
function pearsonBetaFraction(a,b,x){const max=200,eps=3e-14,fp=1e-300, qab=a+b,qap=a+1,qam=a-1;let c=1,d=1-qab*x/qap;if(Math.abs(d)<fp)d=fp;d=1/d;let h=d;for(let m=1;m<=max;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<fp)d=fp;c=1+aa/c;if(Math.abs(c)<fp)c=fp;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<fp)d=fp;c=1+aa/c;if(Math.abs(c)<fp)c=fp;d=1/d;const delta=d*c;h*=delta;if(Math.abs(delta-1)<eps)break}return h}
function pearsonRegularizedBeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(pearsonLogGamma(a+b)-pearsonLogGamma(a)-pearsonLogGamma(b)+a*Math.log(x)+b*Math.log1p(-x));return x<(a+1)/(a+b+2)?bt*pearsonBetaFraction(a,b,x)/a:1-bt*pearsonBetaFraction(b,a,1-x)/b}
function pearsonPValue(r,n){if(n<3)return null;if(Math.abs(r)>=1)return 0;const df=n-2,t2=(r*r*df)/(1-r*r),x=df/(df+t2);return pearsonRegularizedBeta(x,df/2,0.5)}
function pearsonConfidenceInterval(r,n){if(n<4)return null;const safe=Math.max(-0.999999999999,Math.min(0.999999999999,r)),z=Math.atanh(safe),se=1/Math.sqrt(n-3);return [Math.tanh(z-1.959963984540054*se),Math.tanh(z+1.959963984540054*se)]}
function runStatisticsPearson(){const vars=statisticsDraft.analysis?.variables||[],xi=Number($('#pearson-x')?.value),yi=Number($('#pearson-y')?.value),xv=vars[xi],yv=vars[yi];if(!xv||!yv||xi===yi){toast(uiText('בחרו שני משתנים שונים'));return}if(!$('#pearson-confirm-x')?.checked||!$('#pearson-confirm-y')?.checked){toast(uiText('סמנו ששני המשתנים הם מדדי רווח/יחס ולא קודים או קטגוריות'));return}const pairs=statisticsDraft.rows.map(row=>[row[xi],row[yi]]).filter(([a,b])=>/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(String(a??'').trim())&&/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(String(b??'').trim())).map(([a,b])=>[Number(a),Number(b)]),n=pairs.length;if(n<4){statisticsPearsonResult={error:'נדרשות לפחות ארבע תצפיות שלמות כדי לחשב את המתאם ואת רווח הסמך.'};renderBody();return}const mx=pairs.reduce((s,p)=>s+p[0],0)/n,my=pairs.reduce((s,p)=>s+p[1],0)/n,ssx=pairs.reduce((s,p)=>s+(p[0]-mx)**2,0),ssy=pairs.reduce((s,p)=>s+(p[1]-my)**2,0);if(!ssx||!ssy){statisticsPearsonResult={error:'לא ניתן לחשב מתאם כאשר לאחד המשתנים אין שונות.'};renderBody();return}const r=pairs.reduce((s,p)=>s+(p[0]-mx)*(p[1]-my),0)/Math.sqrt(ssx*ssy),p=pearsonPValue(r,n),ci=pearsonConfidenceInterval(r,n);statisticsPearsonResult={x:xv.name,y:yv.name,n,r,p,ci};renderBody()}

statisticsInferenceHtml=function(r){if(r.error)return ("<div class=\"statistics-inference-output\"><b>" + uiText("החישוב לא בוצע") + "</b><p>")+esc(r.error)+'</p></div>';const fmt=(v,d=3)=>statisticsResultNumber(v,d),nInfo=['welch','mannwhitney'].includes(r.method)?'n₁ = '+r.stats.n1+' · n₂ = '+r.stats.n2:'n = '+r.stats.n;let statistic='';if(r.method==='pearson')statistic='r = '+fmt(r.stats.r)+(r.stats.t===null?' · קשר מושלם במדגם; t אינו מוגדר':' · t('+fmt(r.stats.df)+') = '+fmt(r.stats.t));else if(r.method==='spearman')statistic='ρ = '+fmt(r.stats.rho)+(r.stats.t===null?' · קשר מושלם במדגם; t אינו מוגדר':' · קירוב t, df = '+fmt(r.stats.df));else if(r.method==='welch')statistic='הפרש ממוצעים (ב׳ − א׳) = '+fmt(r.stats.difference)+' · t('+fmt(r.stats.df)+') = '+fmt(r.stats.t)+' · Hedges g = '+fmt(r.stats.hedgesG);else statistic='U = '+fmt(r.stats.U)+' · AUC = '+fmt(r.stats.auc)+' · Cliff’s δ = '+fmt(r.stats.cliffsDelta);const p=r.stats.p===null?'ערך p לא מוצג: קירוב נורמלי אינו מדווח כשיש פחות מ־10 מקרים לקבוצה':r.stats.p<0.001?'p < .001'+(r.stats.pApproximate?' (קירוב)':''):'p = '+fmt(r.stats.p,4)+(r.stats.pApproximate?' (קירוב)':'')+' · דו־צדדי';const ci=r.stats.ci?'<p>'+(r.method==='welch'?'רווח סמך 95% להפרש ממוצעים':'רווח סמך 95% למתאם Pearson, בקירוב Fisher-z')+': ['+fmt(r.stats.ci[0])+', '+fmt(r.stats.ci[1])+']</p>':(['spearman','mannwhitney'].includes(r.method)?("<p>" + uiText("רווח סמך לאפקט אינו מחושב בגרסה זו.") + "</p>"):'');return ("<div class=\"statistics-inference-output\"><b>" + uiText("חישוב בוצע לבקשת המשתמש ·") + " ")+esc(r.methodLabel)+'</b><p>'+esc(r.question)+'</p><p>'+esc(r.xName+(r.yName?' × '+r.yName:''))+(r.groupName?' · '+esc(r.groupName+': '+r.groupA+' מול '+r.groupB):'')+'</p><p>'+nInfo+' · '+r.missing+(" " + uiText("מקרים חסרים במשתנים שנבחרו") + "</p><p>")+statistic+' · '+p+'</p>'+ci+("<small>" + uiText("תנאי השיטה, קידוד, חריגים, מבנה המדגם ומגבלות ההסקה דורשים בדיקת חוקר. אין פרשנות אוטומטית של מובהקות או סיבתיות. מנוע") + " ")+esc(r.engineVersion)+' · '+esc(r.dataFileName||uiText('קובץ מקומי שלא נשמר עדיין'))+'</small>'+(statisticsDraft.savedFileId?("<button type=\"button\" onclick=\"saveStatisticsInferenceResult()\">" + uiText("שמירת החישוב והיומן במאמר") + "</button>"):("<small>" + uiText("לשמירת התוצאה במאמר יש לשמור תחילה את קובץ הנתונים.") + "</small>"))+'</div>'};

const statisticsMethodExplanationBeforeAnova=function(method){const docs={pearson:("<b>Pearson r</b> " + uiText("בודק קשר לינארי בין שני מדדי רווח/מנה. נדרשים מיפוי מפורש, בדיקת פיזור, חריגים ועצמאות. חלופה: Spearman לקשר מונוטוני או סדרי. קשר אינו סיבתיות.")),spearman:("<b>Spearman ρ</b> " + uiText("בודק קשר מונוטוני על בסיס דירוגים ומתאים גם לנתונים סדריים לאחר קידוד מפורש. בדקו מונוטוניות ועצמאות; ערך p הוא קירוב. חלופה: Pearson לקשר לינארי במדדי רווח/מנה.")),welch:("<b>Welch t</b> " + uiText("משווה ממוצעים בין שתי קבוצות בלתי תלויות ואינו מניח שוויון שונויות. נדרשים תוצאה ברווח/מנה, עצמאות ובחינת התפלגות וחריגים. חלופה: Mann–Whitney כאשר השוואת דירוגים מתאימה.")),mannwhitney:("<b>Mann–Whitney U</b> " + uiText("משווה דירוגים בין שתי קבוצות בלתי תלויות; הוא אינו מבחן לחציונים בלבד. נדרשים קידוד תקף ובחירה מפורשת של שתי קבוצות. חלופה: Welch כשמתאים להשוואת ממוצעים."))};return docs[method]||'בחרו שיטה כדי לקרוא את מטרתה, התנאים והמגבלות. המערכת אינה בוחרת מבחן אוטומטית.'};
statisticsMethodExplanation=function(method){return method==='anova'?("<b>" + uiText("ANOVA חד־כיוונית") + "</b> " + uiText("משווה ממוצעי תוצאה בין שלוש קבוצות בלתי תלויות או יותר. נדרשים משתנה תוצאה ברווח/מנה, קבוצה שמית/סדרית, תצפיות עצמאיות ובדיקת חריגים, נורמליות ושוויון שונויות. כששוויון השונויות אינו סביר, יש לשקול Welch ANOVA או Kruskal–Wallis. לא מבוצעות בדיקות המשך, ולכן תוצאה כוללת אינה מזהה אילו זוגות קבוצות שונים.")):statisticsMethodExplanationBeforeAnova(method)};
statisticsGuidedAnalysisPanel=function(){const vars=statisticsDraft.variableMap||[],quant=vars.map((m,index)=>({index,name:m.name,scale:m.scale})).filter(x=>['interval','ratio','ordinal'].includes(x.scale)),groupVars=vars.map((m,index)=>({index,name:m.name,scale:m.scale})).filter(x=>['nominal','ordinal'].includes(x.scale)),groupMap=new Map(),gi=Number(statisticsDraft.groupIndex);if(Number.isInteger(gi)&&vars[gi])for(const row of statisticsDraft.rows){const v=String(row[gi]??'').trim();if(v)groupMap.set(v,(groupMap.get(v)||0)+1)}const groups=[...groupMap.keys()].sort((a,b)=>a.localeCompare(b,'he')),needsPair=['welch','mannwhitney'].includes(statisticsDraft.method);return ("<section class=\"statistics-results statistics-guided\"><div class=\"sectionhead\"><div><h3>" + uiText("ניתוח לפי שאלת המחקר") + "</h3><p class=\"muted\">" + uiText("המערכת מחשבת תיאורית עם קליטת CSV. מבחן הסקה מחושב רק לאחר בחירה מפורשת ובדיקת המיפוי.") + "</p></div><span class=\"statistics-pill\">" + uiText("חישוב מקומי") + "</span></div><label class=\"statistics-guided-question\">" + uiText("שאלת מחקר / השערה") + "<input id=\"statistics-analysis-question\" value=\"")+esc(statisticsDraft.analysisQuestion)+("\" placeholder=\"" + uiText("איזו השוואה או זיקה תיבדק?") + "\" oninput=\"statisticsDraft.analysisQuestion=this.value;statisticsDraft.inferenceResult=null\"></label><div class=\"statistics-guided-grid\"><label>" + uiText("מבחן") + "<select id=\"statistics-method\" onchange=\"setStatisticsAnalysisChoice('statistics-method',this.value)\"><option value=\"\">" + uiText("בחרו מבחן במפורש") + "</option>")+[['pearson','Pearson — קשר לינארי'],['spearman','Spearman — קשר מונוטוני / סדרי'],['welch','Welch t — שתי קבוצות עצמאיות'],['mannwhitney','Mann–Whitney U — שתי קבוצות עצמאיות'],['anova','ANOVA חד־כיוונית — 3 קבוצות ומעלה']].map(([v,l])=>'<option value="'+v+'" '+(statisticsDraft.method===v?'selected':'')+'>'+l+'</option>').join('')+'</select></label>'+statisticsVariableSelect('statistics-x',statisticsDraft.analysisX,'משתנה X',quant)+' '+statisticsVariableSelect('statistics-y',statisticsDraft.analysisY,'משתנה תוצאה',quant)+' '+statisticsVariableSelect('statistics-group',statisticsDraft.groupIndex,'משתנה קבוצה',groupVars)+'</div>'+(needsPair?("<div class=\"statistics-guided-grid statistics-group-values\"><label>" + uiText("קבוצה א׳") + "<select id=\"statistics-group-a\" onchange=\"setStatisticsAnalysisChoice('statistics-group-a',this.value)\"><option value=\"\">" + uiText("בחרו קבוצה") + "</option>")+groups.map(g=>'<option value="'+esc(g)+'" '+(statisticsDraft.groupA===g?'selected':'')+'>'+esc(g)+' · '+groupMap.get(g)+'</option>').join('')+("</select></label><label>" + uiText("קבוצה ב׳") + "<select id=\"statistics-group-b\" onchange=\"setStatisticsAnalysisChoice('statistics-group-b',this.value)\"><option value=\"\">" + uiText("בחרו קבוצה") + "</option>")+groups.map(g=>'<option value="'+esc(g)+'" '+(statisticsDraft.groupB===g?'selected':'')+'>'+esc(g)+' · '+groupMap.get(g)+'</option>').join('')+'</select></label></div>':'')+'<div class="statistics-method-explanation">'+statisticsMethodExplanation(statisticsDraft.method)+'</div><label class="statistics-analysis-confirm"><input type="checkbox" '+(statisticsDraft.assumptionsAcknowledged?'checked':'')+(" onchange=\"statisticsDraft.assumptionsAcknowledged=this.checked;statisticsDraft.inferenceResult=null\"> " + uiText("קראתי את תנאי השיטה; ההנחות לא נבדקו אוטומטית.") + "</label><button type=\"button\" class=\"primary\" ")+(!statisticsDraft.method?'disabled':'')+(" onclick=\"runGuidedStatistics()\">" + uiText("חשב לפי הבחירה שלי") + "</button><p class=\"statistics-caution\">" + uiText("אין שינוי בקובץ המקור או השלמת נתונים. אין להסיק סיבתיות מתוצאה תצפיתית. ANOVA אינה כוללת בדיקות המשך.") + "</p>")+(statisticsDraft.inferenceResult?statisticsInferenceHtml(statisticsDraft.inferenceResult):'')+'</section>'};
runGuidedStatistics=function(){const d=statisticsDraft,m=d.method,x=Number(d.analysisX),y=Number(d.analysisY),maps=d.variableMap||[];if(!m){d.inferenceResult={error:'בחרו שיטה במפורש.'};renderBody();return}if(!String(d.analysisQuestion||'').trim()){d.inferenceResult={error:'נסחו את שאלת המחקר או ההשערה.'};renderBody();return}if(!d.assumptionsAcknowledged){d.inferenceResult={error:'יש לקרוא ולאשר את תנאי השיטה לפני החישוב.'};renderBody();return}try{let stats,xName='',yName='',groupName='',groupA='',groupB='',missing=0,label='';if(['pearson','spearman'].includes(m)){if(!Number.isInteger(x)||!Number.isInteger(y)||x===y)throw Error('בחרו שני משתנים שונים.');const xm=maps[x],ym=maps[y],ordinal=m==='spearman';if(xm.reversed===true||ym.reversed===true)throw Error('פריט הפוך דורש קידוד מתועד מראש.');if(m==='pearson'&&(!['interval','ratio'].includes(xm.scale)||!['interval','ratio'].includes(ym.scale)))throw Error('Pearson זמין רק לשני משתנים שמופו במפורש כרווח/מנה.');if(ordinal&&(!['ordinal','interval','ratio'].includes(xm.scale)||!['ordinal','interval','ratio'].includes(ym.scale)))throw Error('Spearman דורש שני משתנים שמופו כסדריים, רווח או מנה.');const xv=statisticsMappedValues(x,ordinal),yv=statisticsMappedValues(y,ordinal),pairs=xv.map((v,i)=>[v,yv[i]]).filter(p=>p.every(Number.isFinite));missing=d.rows.length-pairs.length;if(pairs.length<4)throw Error('נדרשים לפחות ארבעה זוגות שלמים.');stats=m==='pearson'?StatisticsEngine.pearson(pairs.map(p=>p[0]),pairs.map(p=>p[1])):StatisticsEngine.spearman(pairs.map(p=>p[0]),pairs.map(p=>p[1]));xName=maps[x].name;yName=maps[y].name;label=m==='pearson'?'Pearson r':'Spearman ρ';if(m==='spearman')stats.pApproximate=true}else{const gi=Number(d.groupIndex),ym=maps[y],gm=maps[gi];if(!Number.isInteger(y)||!Number.isInteger(gi)||y===gi)throw Error('בחרו משתנה תוצאה ומשתנה קבוצה שונים.');if(ym.reversed===true)throw Error('הפריט סומן כהפוך; יש להכין עמודה מתוקנת ומתועדת לפני החישוב.');if(!['nominal','ordinal'].includes(gm.scale))throw Error('מיפו את משתנה הקבוצה כשמי או סדרי.');if(m==='anova'&&!['interval','ratio'].includes(ym.scale))throw Error('ANOVA דורשת משתנה תוצאה שמופה במפורש כרווח/מנה.');if(m==='welch'&&!['interval','ratio'].includes(ym.scale))throw Error('Welch t דורש משתנה תוצאה ברווח/מנה.');if(m==='mannwhitney'&&!['ordinal','interval','ratio'].includes(ym.scale))throw Error('Mann–Whitney דורש תוצאה סדרית, רווח או מנה.');const values=statisticsMappedValues(y,m==='mannwhitney'),byGroup=new Map();d.rows.forEach((row,i)=>{const g=String(row[gi]??'').trim(),v=values[i];if(!g)return;if(!byGroup.has(g))byGroup.set(g,[]);if(Number.isFinite(v))byGroup.get(g).push(v)});yName=ym.name;groupName=gm.name;missing=d.rows.filter(row=>String(row[gi]??'').trim()).length-[...byGroup.values()].reduce((a,v)=>a+v.length,0);if(m==='anova'){const allGroups=[...byGroup.entries()].map(([name,values])=>({name,values})).filter(g=>g.values.length);stats=StatisticsEngine.oneWayAnova(allGroups);label='ANOVA חד־כיוונית';groupA='כל הקבוצות שנבחרו';}else{if(!d.groupA||!d.groupB||d.groupA===d.groupB)throw Error('בחרו שתי קבוצות שונות.');const a=byGroup.get(d.groupA)||[],b=byGroup.get(d.groupB)||[];if(a.length<2||b.length<2)throw Error('נדרשות לפחות שתי תצפיות תקינות בכל קבוצה.');stats=m==='welch'?StatisticsEngine.welch(a,b):StatisticsEngine.mannWhitney(a,b);if(m==='mannwhitney'){stats.p=stats.n1>=10&&stats.n2>=10?stats.pApprox:null;stats.pApproximate=stats.p!==null}label=m==='welch'?'Welch t לשתי קבוצות עצמאיות':'Mann–Whitney U';groupA=d.groupA;groupB=d.groupB}}d.inferenceResult={method:m,methodLabel:label,question:d.analysisQuestion,xName,yName,groupName,groupA,groupB,missing,stats,dataFileName:d.file?.name||S.files?.find(f=>f.id===d.savedFileId)?.name||'',fileId:d.savedFileId||null,paperId:d.paperId,engineVersion:'Research Statistics Engine 1.1',calculatedAt:now()}}catch(e){d.inferenceResult={error:e.message}}renderBody()};
function statisticsDraftParagraph(r){const f=v=>statisticsResultNumber(v,2),p=r.stats.p===null?'לא חושב ערך p':r.stats.p<.001?'p < .001':'p = '+statisticsResultNumber(r.stats.p,3);if(r.method==='anova')return 'נערכה ANOVA חד־כיוונית לבחינת הבדלים ב־'+r.yName+' בין קבוצות '+r.groupName+' במסגרת השאלה: '+r.question+'. הממוצעים וסטיות התקן היו: '+r.stats.groups.map(g=>g.name+' (n = '+g.n+', M = '+f(g.mean)+', SD = '+f(g.sd)+')').join('; ')+'. התוצאה הכוללת: F('+r.stats.dfBetween+', '+r.stats.dfWithin+') = '+f(r.stats.F)+', '+p+', η² = '+f(r.stats.etaSquared)+'. התוצאה מתייחסת להשוואה הכוללת ואינה מזהה אילו זוגות קבוצות שונים; לא בוצעו בדיקות המשך. יש לבדוק עצמאות, התפלגות ושוויון שונויות לפני פרשנות.';if(r.method==='welch')return 'לצורך בחינת השאלה '+r.question+' הושוו ממוצעי '+r.yName+' בין '+r.groupName+' ('+r.groupA+' ו־'+r.groupB+') באמצעות מבחן t של Welch. בקבוצה א׳: n = '+r.stats.n1+', M = '+f(r.stats.mean1)+'; בקבוצה ב׳: n = '+r.stats.n2+', M = '+f(r.stats.mean2)+'. הפרש הממוצעים (ב׳ פחות א׳) היה '+f(r.stats.difference)+', t('+f(r.stats.df)+') = '+f(r.stats.t)+', '+p+'. נדרשת בדיקת הנחות ותכנון המדגם לפני מסקנה.';if(r.method==='mannwhitney')return 'לצורך בחינת השאלה '+r.question+' הושוו דירוגי '+r.yName+' בין '+r.groupName+' ('+r.groupA+' ו־'+r.groupB+') באמצעות Mann–Whitney U: U = '+f(r.stats.U)+', '+p+', n₁ = '+r.stats.n1+', n₂ = '+r.stats.n2+'. זהו מבחן דירוגים ולא מבחן לחציונים בלבד. נדרשת בדיקת התאמת המבחן, מבנה המדגם והנחותיו לפני מסקנה.';

const instrumentMatchStopWords=new Set(['של','את','על','עם','לפי','האם','מה','איך','כדי','אשר','המחקר','מחקר','שאלות','שאלה','משתנים','משתנה','אני','אנחנו','עבור','the','and','for','with','from','that','this','are','was','were']);
function instrumentMatchTokens(value){return String(value||'').toLocaleLowerCase('he').normalize('NFKC').split(/[^\p{L}\p{N}]+/u).filter(token=>token.length>1&&!instrumentMatchStopWords.has(token))}
function instrumentTokenMatches(a,b){return a===b||(a.length>=4&&b.length>=4&&(a.startsWith(b)||b.startsWith(a)||a.includes(b)||b.includes(a)))}
function instrumentMatchRank(goal,questions,variables){const queries=[['מטרת המחקר',goal,2],['שאלות המחקר',questions,2.5],['המשתנים',variables,3]],queryTokens=queries.flatMap(([source,text,weight])=>instrumentMatchTokens(text).map(token=>({source,token,weight}))),tools=(S.tools||[]).filter(tool=>!tool.type||/שאלון|questionnaire/i.test(tool.type));return tools.map(tool=>{const fields=[['שם הכלי',tool.name,3],['תחום',tool.field||tool.tableGroup,2],['מה הכלי בודק',tool.measures,3],['מטרה',tool.purpose,2.5],['אוכלוסייה',tool.population,1],['הוראות',tool.instructions,1],['שפה',tool.language,0.5]],fieldTokens=fields.map(([name,text,weight])=>({name,weight,tokens:instrumentMatchTokens(text)})),matched=[];let possible=0,achieved=0;for(const q of queryTokens){possible+=q.weight*3;let best=null;for(const field of fieldTokens)if(field.tokens.some(token=>instrumentTokenMatches(q.token,token))&&(!best||field.weight>best.weight))best=field;if(best){achieved+=q.weight*best.weight;matched.push({token:q.token,field:best.name,source:q.source})}}const score=possible?Math.min(100,Math.round(100*achieved/possible)):0,matchedUnique=[...new Set(matched.map(item=>item.token))],reasons=[...new Set(matched.map(item=>item.source+' ↔ '+item.field))];return{tool,score,matched:matchedUnique,reasons,coverage:queryTokens.length?Math.round(100*matchedUnique.length/new Set(queryTokens.map(x=>x.token)).size):0,hasPopulation:!!String(tool.population||'').trim(),hasValidity:!!String(tool.validity||'').trim(),hasPermission:!!String(tool.permissions||'').trim(),hasQuestionnaire:!!(tool.questionnaireUrl||tool.fileId)}}).filter(item=>item.matched.length).sort((a,b)=>b.score-a.score||b.coverage-a.coverage)}
